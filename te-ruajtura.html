<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Të ruajtura - RoadFix Gjilan</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1e40af; --gray-50: #f8fafc; --gray-100: #f1f5f9;
            --gray-200: #e2e8f0; --gray-400: #94a3b8; --gray-500: #64748b;
            --gray-600: #475569; --gray-700: #334155; --gray-800: #1e293b;
            --gray-900: #0f172a; --white: #ffffff; --radius-lg: 16px;
            --radius-md: 10px; --shadow-lg: 0 10px 25px rgba(0,0,0,0.1);
            --transition: all 0.3s ease;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f0f4ff 0%, #e8eeff 50%, #f0f4ff 100%);
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            padding: 20px;
        }
        .saved-container { width: 100%; max-width: 480px; }
        .saved-card {
            background: var(--white); border-radius: 20px; padding: 40px 32px;
            box-shadow: var(--shadow-lg); animation: slideUp 0.5s ease;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .saved-card h2 { font-size: 24px; font-weight: 700; color: var(--gray-900); margin-bottom: 4px; text-align: center; }
        .saved-card .subtitle { font-size: 13px; color: var(--gray-500); margin-bottom: 28px; text-align: center; }
        .empty-state { text-align: center; padding: 40px 20px; }
        .empty-icon {
            width: 80px; height: 80px; background: var(--gray-100);
            border-radius: 50%; display: flex; align-items: center;
            justify-content: center; font-size: 32px; color: var(--gray-400);
            margin: 0 auto 16px;
        }
        .empty-state h3 { font-size: 18px; color: var(--gray-700); margin-bottom: 8px; }
        .empty-state p { font-size: 13px; color: var(--gray-500); }
        .back-link {
            display: inline-flex; align-items: center; gap: 6px;
            color: var(--gray-500); font-size: 13px; text-decoration: none;
            margin-top: 16px; transition: var(--transition);
        }
        .back-link:hover { color: var(--primary); }
    </style>
</head>
<body>
    <div class="saved-container">
        <div class="saved-card">
            <h2> Të ruajtura</h2>
            <p class="subtitle">Lajmet që keni ruajtur</p>
            
            <div class="empty-state">
                <div class="empty-icon"><i class="fas fa-bookmark"></i></div>
                <h3>Asnjë lajm i ruajtur</h3>
                <p>Kur të ruani lajme, ato do të shfaqen këtu për qasje të lehtë.</p>
            </div>
        </div>
        <a href="index.html" class="back-link">
            <i class="fas fa-arrow-left"></i> Kthehu në ballinë
        </a>
    </div>
</body>
</html>
