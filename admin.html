<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - RoadFix Gjilan</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1e40af;
            --primary-light: #3b82f6;
            --primary-dark: #1e3a8a;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --gray-50: #f8fafc;
            --gray-100: #f1f5f9;
            --gray-200: #e2e8f0;
            --gray-300: #cbd5e1;
            --gray-400: #94a3b8;
            --gray-500: #64748b;
            --gray-600: #475569;
            --gray-700: #334155;
            --gray-800: #1e293b;
            --gray-900: #0f172a;
            --white: #ffffff;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 6px rgba(0,0,0,0.07);
            --shadow-lg: 0 10px 25px rgba(0,0,0,0.1);
            --radius-md: 8px;
            --radius-lg: 12px;
            --radius-xl: 16px;
            --transition: all 0.3s ease;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--gray-50);
            color: var(--gray-800);
            display: flex;
            min-height: 100vh;
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: 260px;
            background: var(--white);
            border-right: 1px solid var(--gray-200);
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0; left: 0; bottom: 0;
            z-index: 100;
            transition: transform 0.3s ease;
        }

        .sidebar-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 8px 24px;
            border-bottom: 1px solid var(--gray-200);
            margin-bottom: 20px;
        }

        .sidebar-logo img { width: 45px; height: 45px; border-radius: 8px; }
        .sidebar-logo h2 { font-size: 18px; font-weight: 700; color: var(--gray-900); }
        .sidebar-logo span { color: var(--primary); }

        .sidebar-nav { flex: 1; display: flex; flex-direction: column; gap: 4px; }

        .sidebar-nav a {
            display: flex; align-items: center; gap: 12px;
            padding: 12px 14px; border-radius: var(--radius-md);
            color: var(--gray-600); font-size: 14px; font-weight: 500;
            text-decoration: none; transition: var(--transition); cursor: pointer;
        }

        .sidebar-nav a:hover { background: var(--gray-100); color: var(--gray-900); }
        .sidebar-nav a.active { background: var(--primary); color: var(--white); }
        .sidebar-nav a i { width: 20px; text-align: center; font-size: 16px; }

        .sidebar-footer { border-top: 1px solid var(--gray-200); padding-top: 16px; }

        /* ===== HAMBURGER ===== */
        .hamburger {
            display: none; position: fixed; top: 16px; left: 16px;
            z-index: 200; background: var(--primary); color: var(--white);
            border: none; width: 40px; height: 40px; border-radius: 8px;
            font-size: 20px; cursor: pointer;
        }

        /* ===== MAIN CONTENT ===== */
        .main-content {
            flex: 1; margin-left: 260px; padding: 24px 32px;
            transition: margin-left 0.3s ease;
        }

        /* ===== TOP BAR ===== */
        .topbar {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 32px; flex-wrap: wrap; gap: 12px;
        }

        .topbar h1 { font-size: 26px; font-weight: 700; color: var(--gray-900); }
        .topbar-actions { display: flex; align-items: center; gap: 16px; }
        .topbar-date { color: var(--gray-500); font-size: 14px; }
        .topbar-avatar {
            width: 42px; height: 42px; border-radius: 50%;
            background: var(--primary); color: var(--white);
            display: flex; align-items: center; justify-content: center;
            font-weight: 600; font-size: 16px; cursor: pointer;
        }

        /* ===== STATS ===== */
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 32px; }
        .stat-card {
            background: var(--white); border-radius: var(--radius-lg);
            padding: 20px 24px; box-shadow: var(--shadow-sm); border: 1px solid var(--gray-100);
        }
        .stat-card .stat-number { font-size: 32px; font-weight: 700; color: var(--gray-900); margin-bottom: 4px; }
        .stat-card .stat-label { font-size: 13px; color: var(--gray-500); }
        .stat-change.up { color: var(--success); font-size: 12px; font-weight: 500; }

        /* ===== SECTION CARD ===== */
        .section-card {
            background: var(--white); border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm); border: 1px solid var(--gray-100); overflow: hidden;
        }

        .section-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 16px 20px; border-bottom: 1px solid var(--gray-100);
        }
        .section-header h3 { font-size: 16px; font-weight: 600; color: var(--gray-900); }

        /* ===== TABELA ===== */
        .table-responsive { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th {
            text-align: left; padding: 12px 16px; font-size: 12px; font-weight: 600;
            color: var(--gray-500); text-transform: uppercase; letter-spacing: 0.5px;
            background: var(--gray-50); border-bottom: 1px solid var(--gray-200);
        }
        td {
            padding: 12px 16px; font-size: 13px; color: var(--gray-700);
            border-bottom: 1px solid var(--gray-50);
        }
        tr:hover td { background: var(--gray-50); }

        .badge {
            padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: 600;
            display: inline-block;
        }
        .badge-bllokim { background: #fee2e2; color: #991b1b; }
        .badge-punime { background: #fef3c7; color: #92400e; }
        .badge-devijim { background: #ede9fe; color: #5b21b6; }
        .badge-projekt { background: #d1fae5; color: #065f46; }
        .badge-success { background: #d1fae5; color: #065f46; }
        .badge-warning { background: #fef3c7; color: #92400e; }
        .badge-danger { background: #fee2e2; color: #991b1b; }
        .badge-info { background: #dbeafe; color: #1e40af; }

        .btn-sm {
            padding: 5px 10px; border: none; border-radius: 4px;
            font-size: 11px; cursor: pointer; font-family: 'Inter', sans-serif;
        }
        .btn-edit { background: var(--primary); color: var(--white); }
        .btn-delete { background: var(--danger); color: var(--white); }
        .btn-view { background: var(--gray-200); color: var(--gray-700); }

        .actions { display: flex; gap: 6px; }

        /* ===== PROFILE ===== */
        .profile-card {
            background: var(--white); border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm); border: 1px solid var(--gray-100);
            padding: 24px; text-align: center; margin-bottom: 24px;
        }
        .profile-avatar {
            width: 72px; height: 72px; border-radius: 50%;
            background: var(--primary); color: var(--white);
            display: flex; align-items: center; justify-content: center;
            font-size: 28px; font-weight: 700; margin: 0 auto 12px;
        }
        .profile-card h3 { font-size: 18px; font-weight: 600; color: var(--gray-900); margin-bottom: 2px; }
        .profile-card .role { font-size: 13px; color: var(--gray-500); margin-bottom: 4px; }
        .btn-edit-profile {
            padding: 8px 20px; background: var(--primary); color: var(--white);
            border: none; border-radius: 8px; font-size: 13px; font-weight: 500;
            cursor: pointer; font-family: 'Inter', sans-serif; margin-top: 12px;
        }

        /* ===== CONTENT GRID ===== */
        .content-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 32px; }
        .full-width { grid-column: 1 / -1; }

        /* ===== STATS BOX ===== */
        .stats-box {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; padding: 20px;
        }
        .stats-box-item { text-align: center; padding: 16px; background: var(--gray-50); border-radius: var(--radius-md); }
        .stats-box-item .big { font-size: 24px; font-weight: 700; color: var(--primary); }
        .stats-box-item .label { font-size: 12px; color: var(--gray-500); }

        /* ===== PAGE SECTIONS ===== */
        .page-section { display: none; }
        .page-section.active { display: block; }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 1024px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .content-grid { grid-template-columns: 1fr; }
        }

        @media (max-width: 768px) {
            .hamburger { display: flex; align-items: center; justify-content: center; }
            .sidebar { transform: translateX(-100%); }
            .sidebar.open { transform: translateX(0); }
            .main-content { margin-left: 0; padding: 16px; }
            .stats-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
            .stat-card { padding: 14px 16px; }
            .stat-card .stat-number { font-size: 22px; }
            .topbar h1 { font-size: 20px; }
        }

        @media (max-width: 480px) {
            .stats-grid { grid-template-columns: 1fr; }
            .topbar { flex-direction: column; align-items: flex-start; }
            th, td { padding: 8px 10px; font-size: 11px; }
        }

        /* Overlay për mobile */
        .sidebar-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.5); z-index: 99;
        }
        .sidebar-overlay.active { display: block; }
    </style>
</head>
<body>

    <!-- Hamburger -->
    <button class="hamburger" onclick="toggleSidebar()">☰</button>
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <!-- ============ SIDEBAR ============ -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-logo">
            <img src="logoroadfixgjilan2.png" alt="RoadFix Gjilan">
            <h2>RoadFix <span>Gjilan</span></h2>
        </div>

        <nav class="sidebar-nav">
            <a href="#" class="active" data-page="dashboard" onclick="showPage('dashboard', this)">
                <i class="fas fa-th-large"></i> Paneli
            </a>
            <a href="#" data-page="lajmet" onclick="showPage('lajmet', this)">
                <i class="fas fa-newspaper"></i> Lajmet
            </a>
            <a href="#" data-page="raportimet" onclick="showPage('raportimet', this)">
                <i class="fas fa-exclamation-triangle"></i> Raportimet
            </a>
            <a href="#" data-page="burimet" onclick="showPage('burimet', this)">
                <i class="fas fa-rss"></i> Burimet
            </a>
            <a href="#" data-page="statistikat" onclick="showPage('statistikat', this)">
                <i class="fas fa-chart-bar"></i> Statistikat
            </a>
            <a href="#" data-page="perdoruesit" onclick="showPage('perdoruesit', this)">
                <i class="fas fa-users"></i> Përdoruesit
            </a>
            <a href="#" data-page="logs" onclick="showPage('logs', this)">
                <i class="fas fa-history"></i> Logs
            </a>
        </nav>

        <div class="sidebar-footer">
            <a href="index.html" style="display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:8px;color:var(--gray-600);font-size:14px;font-weight:500;text-decoration:none;">
                <i class="fas fa-arrow-left"></i> Kthehu në faqe
            </a>
        </div>
    </aside>

    <!-- ============ MAIN CONTENT ============ -->
    <main class="main-content" id="mainContent">
        <!-- Përmbajtja ndryshon në varësi të faqes -->
    </main>

    <script>
        // Toggle sidebar për mobile
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('sidebarOverlay').classList.toggle('active');
        }

        // Mbyll sidebar kur klikon një link në mobile
        function closeSidebarOnMobile() {
            if (window.innerWidth <= 768) {
                document.getElementById('sidebar').classList.remove('open');
                document.getElementById('sidebarOverlay').classList.remove('active');
            }
        }

        // Shfaq faqen e zgjedhur
        function showPage(page, linkElement) {
            // Përditëso active state
            document.querySelectorAll('.sidebar-nav a').forEach(a => a.classList.remove('active'));
            if (linkElement) linkElement.classList.add('active');

            // Mbyll sidebar në mobile
            closeSidebarOnMobile();

            const main = document.getElementById('mainContent');

            switch(page) {
                case 'dashboard':
                    main.innerHTML = renderDashboard();
                    break;
                case 'lajmet':
                    main.innerHTML = renderLajmet();
                    break;
                case 'raportimet':
                    main.innerHTML = renderRaportimet();
                    break;
                case 'burimet':
                    main.innerHTML = renderBurimet();
                    break;
                case 'statistikat':
                    main.innerHTML = renderStatistikat();
                    break;
                case 'perdoruesit':
                    main.innerHTML = renderPerdoruesit();
                    break;
                case 'logs':
                    main.innerHTML = renderLogs();
                    break;
                default:
                    main.innerHTML = renderDashboard();
            }
        }

        // ============ RENDER FUNCTIONS ============

        function renderDashboard() {
            return `

                                    <tr><td>Projekt për Unazën e Gjilanit</td><td><span class="badge badge-projekt">Projekt</span></td><td><span class="badge badge-warning">Në pritje</span></td><td>2 orë më parë</td></tr>

                            </table>

                                    <tr><td>Pusetë e hapur</td><td>Rruga Adem Jashari</td><td><button class="btn-sm btn-edit">✓ Aprovo</button> <button class="btn-sm btn-delete">✗ Refuzo</button></td></tr>
                                    <tr><td>Semafort nuk punon</td><td>Kryqëzimi i spitalit</td><td><button class="btn-sm btn-edit">✓ Aprovo</button> <button class="btn-sm btn-delete">✗ Refuzo</button></td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderLajmet() {
            return `
                <div class="topbar"><h1>📰 Menaxho Lajmet</h1><button class="btn-edit-profile" style="padding:10px 18px;"><i class="fas fa-plus"></i> Shto lajm të ri</button></div>
                <div class="section-card"><div class="section-header"><h3>Të gjitha lajmet (24)</h3></div>
                <div class="table-responsive"><table>

                        <tr><td>#4</td><td>Projekt për Unazën e Gjilanit</td><td><span class="badge badge-projekt">Projekt</span></td><td>KosovaPress</td><td>26 Prill 2026</td><td><span class="badge badge-warning">Në pritje</span></td><td class="actions"><button class="btn-sm btn-view">👁</button><button class="btn-sm btn-edit">✏️</button><button class="btn-sm btn-delete">🗑</button></td></tr>

        function renderRaportimet() {
            return `

                <div class="table-responsive"><table>
                    <thead><tr><th>ID</th><th>Titulli</th><th>Lokacioni</th><th>Data</th><th>Statusi</th><th>Veprime</th></tr></thead>
                    <tbody>
                        <tr><td>#1</td><td>Gropa të mëdha në rrugë</td><td>Lagjia Dardania</td><td>15 min më parë</td><td><span class="badge badge-warning">Në pritje</span></td><td class="actions"><button class="btn-sm btn-edit">✓ Aprovo</button><button class="btn-sm btn-delete">✗ Refuzo</button></td></tr>

                    </tbody>
                </table></div></div>
            `;
        }

        function renderBurimet() {
            return `
                <div class="topbar"><h1>📡 Burimet (Scraping)</h1><button class="btn-edit-profile" style="padding:10px 18px;"><i class="fas fa-plus"></i> Shto burim</button></div>
                <div class="section-card"><div class="section-header"><h3>Burimet e konfiguruara (5)</h3></div>
                <div class="table-responsive"><table>

        function renderStatistikat() {
            return `
                <div class="topbar"><h1>📊 Statistikat</h1></div>
