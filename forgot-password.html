<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harruat Fjalëkalimin - RoadFix Gjilan</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1e40af;
            --primary-light: #3b82f6;
            --primary-dark: #1e3a8a;
            --gray-50: #f8fafc;
            --gray-100: #f1f5f9;
            --gray-200: #e2e8f0;
            --gray-300: #cbd5e1;
            --gray-400: #94a3b8;
            --gray-500: #64748b;
            --gray-600: #475569;
            --gray-700: #334155;
            --gray-800: #1e293b;
            --gray-900: #0f172a;
            --white: #ffffff;
            --shadow-lg: 0 10px 25px rgba(0,0,0,0.1);
            --radius-lg: 16px;
            --radius-md: 10px;
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f0f4ff 0%, #e8eeff 50%, #f0f4ff 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-container {
            width: 100%;
            max-width: 440px;
        }

        .auth-card {
            background: var(--white);
            border-radius: 20px;
            padding: 40px 32px;
            box-shadow: var(--shadow-lg);
            text-align: center;
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .auth-logo {
            width: 240px;
            height: auto;
            margin-bottom: 16px;
        }

        .forgot-icon {
            width: 64px;
            height: 64px;
            background: var(--primary);
            color: var(--white);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin: 0 auto 20px;
        }

        .auth-title {
            font-size: 22px;
            font-weight: 700;
            color: var(--gray-900);
            margin-bottom: 8px;
        }

        .auth-text {
            color: var(--gray-500);
            font-size: 14px;
            margin-bottom: 28px;
            line-height: 1.6;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray-400);
            font-size: 16px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 16px 14px 46px;
            border: 2px solid var(--gray-200);
            border-radius: var(--radius-md);
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            transition: var(--transition);
            background: var(--gray-50);
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--primary-light);
            background: var(--white);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }

        .btn-reset {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: var(--white);
            border: none;
            border-radius: var(--radius-md);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-reset:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(30, 64, 175, 0.3);
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--primary);
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
            margin-top: 20px;
            transition: var(--transition);
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .back-home {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--gray-500);
            font-size: 13px;
            text-decoration: none;
            margin-top: 20px;
            transition: var(--transition);
        }

        .back-home:hover {
            color: var(--primary);
        }

        .success-message {
            display: none;
            background: #d1fae5;
            color: #065f46;
            padding: 14px 16px;
            border-radius: var(--radius-md);
            font-size: 14px;
            margin-bottom: 20px;
            border: 1px solid #a7f3d0;
        }

        .success-message i {
            margin-right: 6px;
        }

        @media (max-width: 480px) {
            .auth-card {
                padding: 30px 20px;
            }
            
            .auth-logo {
                width: 140px;
            }
            
            .forgot-icon {
                width: 50px;
                height: 50px;
                font-size: 22px;
            }
            
            .auth-title {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <!-- Logo -->
            <img src="logoroadfixgjilan.png" alt="RoadFix Gjilan" class="auth-logo">
            
            <!-- Ikona -->
            <div class="forgot-icon">
                <i class="fas fa-key"></i>
            </div>
            
            <!-- Titulli -->
            <h2 class="auth-title">Harruat fjalëkalimin?</h2>
            <p class="auth-text">
                Shkruani email-in tuaj dhe do t'ju dërgojmë një link për të rikthyer fjalëkalimin.
            </p>
            
            <!-- Mesazhi i suksesit (i fshehur fillimisht) -->
            <div class="success-message" id="successMessage">
                <i class="fas fa-check-circle"></i> Linku u dërgua me sukses! Kontrolloni email-in tuaj.
            </div>
            
            <!-- Forma -->
            <form id="forgotForm" onsubmit="handleForgotPassword(event)">
                <div class="input-group">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="forgotEmail" placeholder="Email-i juaj" required>
                </div>
                
                <button type="submit" class="btn-reset" id="resetBtn">
                    <i class="fas fa-paper-plane"></i> Dërgo linkun
                </button>
            </form>
            
            <!-- Kthehu te login -->
            <a href="login.html" class="back-link">
                <i class="fas fa-arrow-left"></i> Kthehu te hyrja
            </a>
        </div>
        
        <!-- Kthehu në ballinë -->
        <a href="index.html" class="back-home">
            <i class="fas fa-arrow-left"></i> Kthehu në ballinë
        </a>
    </div>

    <script>
        function handleForgotPassword(event) {
            event.preventDefault();
            
            const email = document.getElementById('forgotEmail').value.trim();
            
            if (!email) {
                alert('Ju lutemi shkruani email-in tuaj.');
                return;
            }
            
            // Fshih formën, trego mesazhin e suksesit
            document.getElementById('forgotForm').style.display = 'none';
            document.getElementById('successMessage').style.display = 'block';
            
            // Opsionale: Dërgo email në backend
            console.log('Linku i rikthimit u dërgua në:', email);
        }
    </script>
</body>
</html>
