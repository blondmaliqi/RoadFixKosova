<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regjistrohu - RoadFix Gjilan</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1e40af;
            --primary-light: #3b82f6;
            --primary-dark: #1e3a8a;
            --gray-50: #f8fafc;
            --gray-100: #f1f5f9;
            --gray-200: #e2e8f0;
            --gray-300: #cbd5e1;
            --gray-400: #94a3b8;
            --gray-500: #64748b;
            --gray-600: #475569;
            --gray-700: #334155;
            --gray-800: #1e293b;
            --gray-900: #0f172a;
            --white: #ffffff;
            --shadow-lg: 0 10px 25px rgba(0,0,0,0.1);
            --radius-lg: 16px;
            --radius-md: 10px;
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f0f4ff 0%, #e8eeff 50%, #f0f4ff 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-container {
            width: 100%;
            max-width: 460px;
        }

        .auth-card {
            background: var(--white);
            border-radius: 20px;
            padding: 36px 32px;
            box-shadow: var(--shadow-lg);
            text-align: center;
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .auth-logo {
            width: 240px;
            height: auto;
            margin-bottom: 16px;
        }

        .input-row {
            display: flex;
            gap: 12px;
            margin-bottom: 18px;
        }

        .input-group {
            position: relative;
            text-align: left;
            flex: 1;
        }

        .input-group i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray-400);
            font-size: 16px;
            z-index: 1;
        }

        .input-group input {
            width: 100%;
            padding: 14px 16px 14px 46px;
            border: 2px solid var(--gray-200);
            border-radius: var(--radius-md);
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            transition: var(--transition);
            background: var(--gray-50);
        }

        .input-group input[type="password"],
        .input-group input[type="text"] {
            padding-right: 50px;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--primary-light);
            background: var(--white);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }

        .password-toggle {
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            width: 46px;
            background: transparent;
            border: none;
            color: var(--gray-400);
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 0 var(--radius-md) var(--radius-md) 0;
            transition: var(--transition);
        }

        .password-toggle:hover {
            background: var(--gray-100);
            color: var(--gray-600);
        }

        .terms-check {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            margin-bottom: 24px;
            font-size: 13px;
            color: var(--gray-600);
            text-align: left;
        }

        .terms-check input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--primary);
            margin-top: 2px;
            flex-shrink: 0;
        }

        .terms-check a {
            color: var(--primary);
            font-weight: 500;
            text-decoration: none;
        }

        .terms-check a:hover {
            text-decoration: underline;
        }

        .btn-signup {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: var(--white);
            border: none;
            border-radius: var(--radius-md);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-signup:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(30, 64, 175, 0.3);
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 24px 0;
            color: var(--gray-400);
            font-size: 12px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--gray-200);
        }

        .social-buttons {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }

        .social-btn {
            flex: 1;
            padding: 12px;
            border: 2px solid var(--gray-200);
            border-radius: var(--radius-md);
            background: var(--white);
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: var(--transition);
            font-family: 'Inter', sans-serif;
        }

        .social-btn:hover {
            background: var(--gray-50);
        }

        .social-btn.google {
            color: #ea4335;
            border-color: #fecaca;
        }

        .social-btn.google:hover {
            background: #fef2f2;
        }

        .social-btn.facebook {
            color: #1877f2;
            border-color: #bfdbfe;
        }

        .social-btn.facebook:hover {
            background: #eff6ff;
        }

        .login-link {
            font-size: 14px;
            color: var(--gray-600);
        }

        .login-link a {
            color: var(--primary);
            font-weight: 600;
            text-decoration: none;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .back-home {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--gray-500);
            font-size: 13px;
            text-decoration: none;
            margin-top: 20px;
            transition: var(--transition);
        }

        .back-home:hover {
            color: var(--primary);
        }

        @media (max-width: 480px) {
            .auth-card {
                padding: 28px 18px;
            }
            
            .auth-logo {
                width: 140px;
            }
            
            .input-row {
                flex-direction: column;
                gap: 18px;
            }
            
            .social-buttons {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <!-- Logo -->
            <img src="logoroadfixgjilan.png" alt="RoadFix Gjilan" class="auth-logo">
            
            <!-- Forma e regjistrimit -->
            <form onsubmit="handleSignup(event)">
                <div class="input-row">
                    <div class="input-group">
                        <i class="fas fa-user"></i>
                        <input type="text" id="signupName" placeholder="Emri" required>
                    </div>
                    <div class="input-group">
                        <i class="fas fa-user"></i>
                        <input type="text" id="signupSurname" placeholder="Mbiemri" required>
                    </div>
                </div>
                
                <div class="input-row" style="margin-bottom: 18px;">
                    <div class="input-group">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="signupEmail" placeholder="Email-i juaj" required>
                    </div>
                </div>
                
                <div class="input-row" style="margin-bottom: 18px;">
                    <div class="input-group">
                        <i class="fas fa-phone"></i>
                        <input type="tel" id="signupPhone" placeholder="Numri i telefonit" required>
                    </div>
                </div>
                
                <div class="input-row" style="margin-bottom: 18px;">
                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="signupPassword" placeholder="Fjalëkalimi (min. 6 karaktere)" required minlength="6">
                        <button type="button" class="password-toggle" onclick="togglePassword('signupPassword', this)">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                
                <div class="input-row" style="margin-bottom: 18px;">
                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="signupConfirm" placeholder="Konfirmo fjalëkalimin" required minlength="6">
                        <button type="button" class="password-toggle" onclick="togglePassword('signupConfirm', this)">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                
                <label class="terms-check">
                    <input type="checkbox" required>
                    <span>Pajtohem me <a href="kushtet.html">Kushtet e përdorimit</a> dhe <a href="privatësia.html">Politikën e privatësisë</a></span>
                </label>
                
                <button type="submit" class="btn-signup">
                    <i class="fas fa-user-plus"></i> Regjistrohu
                </button>
            </form>
            
            <!-- Divider -->
            <div class="divider">
                <span>ose regjistrohu me</span>
            </div>
            
            <!-- Rrjetet sociale -->
            <div class="social-buttons">
                <button class="social-btn google" onclick="socialLogin('google')">
                    <i class="fab fa-google"></i> Google
                </button>
                <button class="social-btn facebook" onclick="socialLogin('facebook')">
                    <i class="fab fa-facebook-f"></i> Facebook
                </button>
            </div>
            
            <!-- Link për në login -->
            <p class="login-link">
                Keni tashmë llogari? <a href="login.html">Hyni këtu</a>
            </p>
        </div>
        
        <!-- Kthehu në ballinë -->
        <a href="index.html" class="back-home">
            <i class="fas fa-arrow-left"></i> Kthehu në ballinë
        </a>
    </div>

   <script>
    // Lejo vetëm numra në fushën e telefonit
    document.addEventListener('DOMContentLoaded', function() {
        const phoneInput = document.getElementById('signupPhone');
        
        phoneInput.addEventListener('input', function(e) {
            // Zëvendëso çdo gjë që nuk është numër me karakter bosh
            this.value = this.value.replace(/[^0-9]/g, '');
        });
        
        // Parandalo shkrimin e shkronjave
        phoneInput.addEventListener('keypress', function(e) {
            if (!/[0-9]/.test(e.key)) {
                e.preventDefault();
            }
        });
    });

    function togglePassword(inputId, button) {
        const input = document.getElementById(inputId);
        const icon = button.querySelector('i');
        
        if (input.type === 'password') {
            input.type = 'text';
            icon.classList.remove('fa-eye');
            icon.classList.add('fa-eye-slash');
        } else {
            input.type = 'password';
            icon.classList.remove('fa-eye-slash');
            icon.classList.add('fa-eye');
        }
    }
    
    function handleSignup(event) {
        event.preventDefault();
        
        const name = document.getElementById('signupName').value.trim();
        const surname = document.getElementById('signupSurname').value.trim();
        const email = document.getElementById('signupEmail').value.trim();
        const phone = document.getElementById('signupPhone').value.trim();
        const password = document.getElementById('signupPassword').value;
        const confirm = document.getElementById('signupConfirm').value;
        
        if (!name || !surname || !email || !phone || !password || !confirm) {
            alert('Ju lutemi plotësoni të gjitha fushat.');
            return;
        }
        
        if (phone.length < 6) {
            alert('Ju lutemi shkruani një numër telefoni të vlefshëm.');
            return;
        }
        
        if (password !== confirm) {
            alert('Fjalëkalimet nuk përputhen!');
            return;
        }
        
        if (password.length < 6) {
            alert('Fjalëkalimi duhet të ketë të paktën 6 karaktere.');
            return;
        }
        
        const user = {
            name: name,
            surname: surname,
            email: email,
            phone: phone,
            avatar: null
        };
        
        localStorage.setItem('currentUser', JSON.stringify(user));
        window.location.href = 'index.html';
    }
    
    function socialLogin(platform) {
        alert('Regjistrimi me ' + platform + ' do të jetë së shpejti i disponueshëm.');
    }
</script>
</body>
</html>
